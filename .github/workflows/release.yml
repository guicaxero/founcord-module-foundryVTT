name: Release Foundry module

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Validate tag and manifest
        shell: bash
        run: |
          version="$(bun -e "console.log(require('./module.json').version)")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module version ${version}."
            exit 1
          fi

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, test and build
        run: bun run check

      - name: Package module
        shell: bash
        run: |
          cd dist/ordem-foundry-bridge
          zip -r ../ordem-foundry-bridge.zip .
          cd ../..
          cp module.json dist/module.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/module.json \
            dist/ordem-foundry-bridge.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Ordem Foundry Bridge ${GITHUB_REF_NAME}" \
            --generate-notes
